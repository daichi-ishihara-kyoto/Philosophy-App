<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ガネーシャの課題</title>
    
    <!-- PWA用 -->
    <meta name="theme-color" content="#f59e0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://placehold.co/180x180/f59e0b/ffffff?text=G">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'title': ['"M PLUS Rounded 1c"', 'sans-serif'],
                        'body': ['"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        ganesha: {
                            gold: '#fbbf24',
                            orange: '#f97316',
                            red: '#ef4444',
                            dark: '#451a03'
                        }
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'pop-in': 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'shake': 'shake 0.1s ease-in-out infinite'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.8) translateY(20px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '25%': { transform: 'translateX(-2px)' },
                            '75%': { transform: 'translateX(2px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            overflow: hidden;
            touch-action: pan-y;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        .push-button {
            transition: all 0.1s ease;
            box-shadow: 0 8px 0 #b45309, 0 15px 20px rgba(0,0,0,0.2);
        }
        .push-button:active, .push-button.is-pressed {
            transform: translateY(8px);
            box-shadow: 0 0px 0 #b45309, 0 5px 10px rgba(0,0,0,0.2);
        }
        .shuffling {
            filter: blur(1px);
            opacity: 0.7;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-yellow-200 via-orange-300 to-amber-500 h-screen w-full flex flex-col items-center justify-between p-6 font-body text-ganesha-dark">

    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[120%] h-[120%] bg-[radial-gradient(circle,rgba(255,255,255,0.4)_0%,transparent_60%)]"></div>
    </div>

    <header class="w-full text-center mt-8 safe-top">
        <div class="inline-block animate-float">
            <i class="fa-solid fa-om text-4xl text-white opacity-80 mb-2"></i>
        </div>
        <h1 class="text-3xl font-title font-bold text-white drop-shadow-md">
            今日の課題
        </h1>
        <p class="text-white/90 text-sm mt-2 font-medium">夢をかなえるゾウ</p>
    </header>

    <main class="w-full max-w-md flex-grow flex items-center justify-center my-8 relative z-10">
        <div id="task-card" class="glass-card w-full rounded-3xl p-8 shadow-2xl relative flex flex-col items-center justify-center min-h-[320px] text-center transform transition-transform duration-500">
            <div id="elephant-icon" class="text-6xl text-ganesha-orange mb-4 opacity-50 transition-opacity duration-300">
                🐘
            </div>
            <h2 id="task-title" class="text-2xl md:text-3xl font-title font-bold leading-tight mb-6 text-gray-800">
                ここをタップして<br>課題を引くぞう
            </h2>
            <div id="task-detail-container" class="hidden w-full">
                <div class="w-12 h-1 bg-ganesha-orange mx-auto mb-4 rounded-full opacity-50"></div>
                <p id="task-detail" class="text-base text-gray-700 leading-relaxed font-medium"></p>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-md mb-12 flex justify-center safe-bottom">
        <button id="draw-button" class="push-button w-[80%] bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-title font-bold text-xl py-5 rounded-full flex items-center justify-center gap-3 relative overflow-hidden group">
            <div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div>
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span id="button-text">課題を引く</span>
        </button>
    </footer>

    <script>
        const drawButton = document.getElementById('draw-button');
        const buttonText = document.getElementById('button-text');
        const taskTitle = document.getElementById('task-title');
        const taskDetailContainer = document.getElementById('task-detail-container');
        const taskDetail = document.getElementById('task-detail');
        const elephantIcon = document.getElementById('elephant-icon');
        const taskCard = document.getElementById('task-card');
        const buttonIcon = drawButton.querySelector('i');

        let tasks = [];
        let isAnimating = false;

        // ページ読み込み時に tasks.json を取得する
        window.onload = async () => {
            try {
                // 同じ階層にある tasks.json を読み込む
                const response = await fetch('./tasks.json');
                tasks = await response.json();
            } catch (error) {
                console.error("データの読み込みに失敗しました:", error);
                taskTitle.innerHTML = "データの読み込みに<br>失敗したぞう...";
                taskDetail.textContent = "電波の良いところでリロードしてみてね。";
                taskDetailContainer.classList.remove('hidden');
            }
        };

        drawButton.addEventListener('click', () => {
            if (isAnimating) return;
            if (tasks.length === 0) {
                alert("課題データが読み込めていません。リロードしてください。");
                return;
            }
            startGacha();
        });

        function startGacha() {
            isAnimating = true;
            
            buttonText.textContent = "お告げを受信中...";
            buttonIcon.className = "fa-solid fa-spinner fa-spin";
            drawButton.classList.add('opacity-80', 'scale-95');

            taskDetailContainer.classList.add('hidden');
            taskTitle.classList.add('shuffling');
            elephantIcon.classList.add('animate-shake');

            const shuffleDuration = 1500;
            const shuffleInterval = 80;
            
            let shuffleTimer = setInterval(() => {
                const randomTask = tasks[Math.floor(Math.random() * tasks.length)];
                taskTitle.textContent = randomTask.task;
            }, shuffleInterval);

            setTimeout(() => {
                clearInterval(shuffleTimer);
                showResult();
            }, shuffleDuration);
        }

        function showResult() {
            const finalTask = tasks[Math.floor(Math.random() * tasks.length)];

            taskTitle.classList.remove('shuffling');
            elephantIcon.classList.remove('animate-shake');
            
            taskCard.style.transform = 'scale(0.95)';
            setTimeout(() => {
                taskCard.style.transform = 'scale(1)';
            }, 100);

            taskTitle.textContent = finalTask.task;
            taskDetail.textContent = finalTask.detail;

            taskDetailContainer.classList.remove('hidden');
            taskDetailContainer.classList.add('animate-pop-in');

            setTimeout(() => {
                buttonText.textContent = "もう一度引く";
                buttonIcon.className = "fa-solid fa-rotate-right";
                drawButton.classList.remove('opacity-80', 'scale-95');
                isAnimating = false;
            }, 300);
            
            if (navigator.vibrate) {
                navigator.vibrate([50, 50, 100]);
            }
        }
    </script>
</body>
</html>
